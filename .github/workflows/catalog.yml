name: Validate Catalog

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - '.github/workflows/catalog.yml'
  pull_request:
    paths:
      - 'catalog/**'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate catalog
        run: python scripts/validate_catalog.py
