name: Update Catalog

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/sources.json'
      - 'scripts/update_catalog.py'
      - '.github/workflows/update-catalog.yml'

permissions:
  contents: write

concurrency:
  group: update-catalog-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update catalog from GitHub releases
        run: python scripts/update_catalog.py

      - name: Validate catalog
        run: python scripts/validate_catalog.py

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/apps catalog/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog is already up to date."
          else
            git commit -m "Update app catalog"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
